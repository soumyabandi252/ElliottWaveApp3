name: Elliott Wave Scan

on:
  schedule:
    - cron: '0 3 * * 6'   # Runs Friday 10:00 PM EST (UTC-5) = Saturday 3:00 AM UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore ticker data cache
        uses: actions/cache@v4
        with:
          path: ELL_Output/_cache
          key: ew-cache-${{ github.run_id }}
          restore-keys: |
            ew-cache-

      - name: Remove existing workbook if present
        run: |
          FILE="Elliott_Wave_NASDAQ_Composite_Master_Workbook.xlsx"
          if [ -f "$FILE" ]; then
            echo "Existing file found, deleting: $FILE"
            rm -f "$FILE"
          else
            echo "No existing file found, proceeding fresh."
          fi

      - name: Run Elliott Wave scan
        run: python elliott_wave_NASDAQ_FINAL_optimized.py

      - name: Save ticker data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ELL_Output/_cache
          key: ew-cache-${{ github.run_id }}

      - name: Commit updated workbook
        run: |
          FILE="Elliott_Wave_NASDAQ_Composite_Master_Workbook.xlsx"

          if [ ! -f "$FILE" ]; then
            echo "Workbook missing after scan — skipping commit to avoid deleting repo history."
            exit 1
          fi

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add "$FILE"
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Auto-update Elliott Wave scan results [skip ci]"

          git fetch origin main

          if git rebase origin/main -X theirs; then
            echo "Rebase succeeded cleanly."
          else
            echo "Rebase hit a conflict — resolving by keeping the freshly generated workbook."
            git rebase --abort || true
            git fetch origin main
            git reset --soft origin/main
            git add "$FILE"
            git diff --cached --quiet && echo "No changes to commit after reset" || git commit -m "Auto-update Elliott Wave scan results [skip ci]"
          fi

          git push origin main
